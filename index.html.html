<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halachic Dash (class)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1744; --card:#FFFFFF; --ink:#14246B; --muted:#4A5690; --line:#CBD4F5;
  --gold:#F2B632; --gold-ink:#5A3B00; --coral:#FF7A59;
  --ok:#1E9E6A; --ok-bg:#DDF5EA; --bad:#D8452B; --bad-bg:#FFE3DC;
  --f:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --u:9px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --card:#16256E; --ink:#EAF0FF; --muted:#AEBBF0; --line:#2C3C8F;
    --ok:#6FE0AC; --ok-bg:#12493B; --bad:#FF9B84; --bad-bg:#5B2A2A; --gold-ink:#3A2600;
  }
}
:root[data-theme="dark"]{
  --card:#16256E; --ink:#EAF0FF; --muted:#AEBBF0; --line:#2C3C8F;
  --ok:#6FE0AC; --ok-bg:#12493B; --bad:#FF9B84; --bad-bg:#5B2A2A; --gold-ink:#3A2600;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;font-size:18px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#box{position:relative;width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9;max-height:100dvh}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#14246B}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#snd{position:absolute;right:8px;bottom:8px;padding:5px 11px;border-radius:999px;background:rgba(20,36,107,.75);color:#EAF0FF;font-size:13px;border:2px solid rgba(234,240,255,.35)}
#sheet{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);top:13%;background:var(--card);color:var(--ink);border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.8);box-shadow:0 8px 30px rgba(0,0,0,.35);transform:translateY(-130%);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.9,.3,1.1),opacity .25s;z-index:3}
#sheet.on{transform:none;opacity:1;pointer-events:auto}
.tag{display:inline-block;padding:2px calc(var(--u)*1.2);border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:max(12px,calc(var(--u)*1.7));font-weight:600;margin-bottom:calc(var(--u)*.8)}
.sq{font-size:max(15px,calc(var(--u)*3));line-height:1.18;font-weight:600;margin:0 0 calc(var(--u)*.5)}
.ss{font-size:max(12px,calc(var(--u)*1.9));color:var(--muted);margin:0 0 calc(var(--u)*1)}
.og{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.1)}
.opt{display:block;width:100%;text-align:left;padding:calc(var(--u)*1.1) calc(var(--u)*1.5);border-radius:calc(var(--u)*1.4);background:var(--card);border:2px solid var(--line);font-size:max(13px,calc(var(--u)*2.5));font-weight:600;line-height:1.15}
.opt i{font-style:normal;opacity:.55;margin-right:.4em}
.opt:active{transform:scale(.97)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
#toast{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);top:13%;padding:calc(var(--u)*1.3) calc(var(--u)*2);border-radius:calc(var(--u)*1.6);font-size:max(13px,calc(var(--u)*2.4));font-weight:600;opacity:0;transform:translateY(-12px);transition:opacity .3s,transform .3s;pointer-events:none;z-index:2;text-align:center}
#toast.on{opacity:1;transform:none}
#toast.ok{background:var(--ok-bg);color:var(--ok)}
#toast.no{background:var(--bad-bg);color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(8,14,50,.78);display:grid;place-items:center;padding:14px;overflow:auto;z-index:5}
.ov[hidden]{display:none}
.pn{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;width:100%;max-width:560px;max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pn h1{margin:0 0 6px;font-size:32px;line-height:1.05;font-weight:600}
.pn p{margin:0 0 10px}
.pn ul{margin:0 0 12px;padding-left:20px}
.pn li{margin-bottom:4px}
.go{display:block;width:100%;padding:14px;border-radius:16px;background:var(--gold);color:var(--gold-ink);font-size:21px;font-weight:600;text-align:center;margin-top:6px}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.stars svg{width:60px;height:60px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:17px;color:var(--muted);margin-bottom:6px}
.center{text-align:center}
input{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0 10px;-webkit-user-select:text;user-select:text}
label{display:block;font-size:15px;color:var(--muted)}
.err{color:var(--bad);min-height:1.4em;margin:0 0 6px}
.opt.pend{opacity:.6}
.rvbar{margin:6px 0 10px;font-size:16px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-left:5px;vertical-align:-2px}
.dot.on{background:var(--gold);border-color:var(--gold)}
.rvg{grid-template-columns:1fr 1fr !important}
.pn .opt{font-size:17px;padding:10px 12px}
@media (max-width:520px){.rvg{grid-template-columns:1fr !important}}
.pn .opt{margin-bottom:0}
.fb{margin:12px 0 4px;padding:10px 12px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.lo{display:block;width:100%;margin-top:10px;padding:8px;font-size:14px;color:var(--muted);text-decoration:underline}
.lvs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px}
.lvs div{text-align:center;font-size:12px;line-height:1.1;width:84px;color:var(--muted)}
.lvs img{width:56px;height:56px;display:block;margin:0 auto 3px}
.lvs b{display:block;color:var(--ink);font-size:13px}
.pop{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1);opacity:1}}
@media (orientation:portrait){
  #sheet{position:fixed;top:auto;left:3vw;right:3vw;bottom:calc(3vw + env(safe-area-inset-bottom,0px));transform:translateY(130%);--u:2.4vw}
  #sheet.on{transform:none}
  #toast{position:fixed;top:auto;left:3vw;right:3vw;bottom:calc(3vw + env(safe-area-inset-bottom,0px));--u:2.4vw}
  .rot{display:block !important}
}
.rot{display:none;font-size:15px;color:var(--muted);margin-bottom:10px}
@media (prefers-reduced-motion:reduce){.pop{animation:none}#sheet,#toast{transition:none}}
</style>
</head>
<body>
<div id="wrap"><div id="box"><canvas id="cv" aria-label="Halachic Dash game. Tap, click, or press space to jump."></canvas>
<div id="sheet" role="dialog" aria-live="polite"></div><div id="toast" role="status"></div>
<button id="snd" aria-pressed="false">Sound on</button></div></div>
<div class="ov" id="ov" hidden><div class="pn" id="pn"></div></div>
<script>
(function () {
  "use strict";
  var W = 960, H = 540, GY = 430, CXS = 220, SZ = 40, G = 2700, JV = 830, NEED = 18, EVERY = 8, BASE = 380;
  var LEVELS = ["Chumash", "Mishnah", "Gemara", "Rambam", "Shulchan Aruch", "Chassidus"];
  var box = document.getElementById("box"), cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var ov = document.getElementById("ov"), pn = document.getElementById("pn"), sheet = document.getElementById("sheet"), toast = document.getElementById("toast"), sndBtn = document.getElementById("snd");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  function sizeU() { document.documentElement.style.setProperty("--u", (box.clientWidth / 100).toFixed(2) + "px"); }
  sizeU(); window.addEventListener("resize", sizeU);

  /* ---------- helpers ---------- */
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- audio ---------- */
  var ac = null, muted = false;
  function beep(f, d, type, vol, slide) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
      g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  function sJump() { beep(380, 0.12, "square", 0.035, 620); }
  function sAsk() { beep(520, 0.1, "triangle", 0.08); setTimeout(function () { beep(780, 0.14, "triangle", 0.08); }, 90); }
  function sGood() { beep(660, 0.12, "triangle", 0.1); setTimeout(function () { beep(990, 0.12, "triangle", 0.1); }, 100); setTimeout(function () { beep(1320, 0.22, "triangle", 0.1); }, 200); }
  function sBad() { beep(220, 0.35, "sawtooth", 0.08, 70); }
  sndBtn.addEventListener("click", function (e) {
    e.stopPropagation(); muted = !muted; sndBtn.textContent = muted ? "Sound off" : "Sound on"; sndBtn.setAttribute("aria-pressed", muted ? "true" : "false");
  });
  sndBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

  /* ---------- state ---------- */
  var CL = 120, NOCE = -1e9, MAXAIR = 2, airJ = 2;
  var mode = "menu", dist = 0, yb = GY, vy = 0, rot = 0, onG = true, buf = 0, taps = 0, held = false, holdAcc = 0;
  var pm = "cube", gdir = 1, spTop = false, spMoving = false, spTarget = GY, grace = 0, modeTxt = "", modeT = 0, modeCol = "#F2B632";
  var zones = [], lastZoneEnd = 0, lastKind = "";
  var correctN = 0, streak = 0, score = 0, mistakes = 0, attempt = 1, obs = [], nextX = 900, parts = [], trail = [], trailT = 0;
  var deadT = 0, cur = null, answered = false, ts = 1, tsT = 1, pDisp = 0, shake = 0, flash = 0, lastT = 0, clockT = 0, pulse = 0, bannerT = 0, bannerTxt = "";

  var COL = { yellow: "#F2B632", pink: "#FF7AC6", red: "#FF3B4E", blue: "#3BA7FF", green: "#4EE07A" };
  var PORT = { ship: "#FF5FA2", ufo: "#FF9A3D", wave: "#3DE6FF", spider: "#A66BFF", flip: "#3BA7FF", cube: "#4EE07A" };
  var MODETXT = {
    ship: "SHIP \u00b7 hold to fly up", ufo: "UFO \u00b7 tap to hop", wave: "WAVE \u00b7 hold to rise, let go to sink",
     spider: "SPIDER \u00b7 tap to switch sides", flip: "GRAVITY \u00b7 blue pads and orbs flip you", cube: "CUBE"
  };

  function sp() { return mode === "menu" ? BASE : Math.min(525, BASE + 9 * correctN); }
  function diff() { return correctN + taps / EVERY; }
  function resetRun() {
    dist = 0; yb = GY; vy = 0; rot = 0; onG = true; buf = 0; obs = []; zones = []; lastZoneEnd = 0; lastKind = ""; nextX = 900; trail = [];
    pm = "cube"; gdir = 1; spMoving = false; spTop = false; grace = 0; holdAcc = 0; airJ = MAXAIR;
  }
  function newGame() {
    if (locked) { enterReview(); return; }
    correctN = 0; streak = 0; score = 0; mistakes = 0; attempt = 1; taps = 0; pDisp = 0; resetRun();
    sheet.classList.remove("on"); toast.classList.remove("on"); tsT = 1; ts = 0.6; mode = "play"; ov.hidden = true; bannerTxt = "Chumash"; bannerLvl = 0; bannerSub = "Cube run: jump the spikes"; bannerT = BANT; modeT = 0; pendKind = null; prefetch();
  }
  function burst(x, y, n, cols, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, s = (power || 300) * (0.3 + Math.random());
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, r: 3 + Math.random() * 6, c: cols[i % cols.length], life: 1, g: 1200 });
    }
  }
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function cl(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- obstacles ---------- */
  function addSp(x, n, top) { obs.push({ t: top ? "cs" : "s", x: x, n: n, w: n * 40 }); }
  function addMk(x) { obs.push({ t: "m", x: x, w: 1, nc: false }); }
  function addBlk(x, w, h, k) { obs.push({ t: "b", x: x, w: w, h: h, k: !!k }); }
  function addCb(x, w, h) { obs.push({ t: "cb", x: x, w: w, h: h }); }
  function addPad(x, y, c, top) { obs.push({ t: "p", x: x, w: 40, y: y || GY, c: c || "yellow", top: !!top, used: false }); }
  function addOrb(x, y, c) { obs.push({ t: "o", x: x, w: 1, y: y, c: c || "yellow", used: false }); }
  function addSaw(x, y, r) { obs.push({ t: "w", x: x, w: 1, y: y, r: r || 18 }); }

  var PAT = {
    spikes: function (x, d) { var n = d < 3 ? ri(1, 2) : ri(1, 3); addSp(x, n); return n * 40; },
    hop: function (x, d) {
      var w = ri(2, 4) * 40, h = d >= 6 && Math.random() < 0.4 ? 80 : 40;
      addBlk(x, w, h);
      if (d >= 3 && Math.random() < 0.6) { addSp(x + w + (h === 80 ? 230 : 170), d >= 9 ? ri(1, 2) : 1); return w + 300; }
      return w;
    },
    stairs: function (x) { addBlk(x, 120, 40); addBlk(x + 120, 120, 80); return 240; },
    pad: function (x, d) {
      var pink = Math.random() < 0.4, n = pink ? 2 : ri(3, 4);
      addPad(x, GY, pink ? "pink" : "yellow"); addSp(x + 100, n); return 100 + n * 40 + 130;
    },
    redPad: function (x) { addPad(x, GY, "red"); addSp(x + 110, 6); return 110 + 240 + 200; },
    orb: function (x, d) { var n = d >= 9 ? 6 : 5; addSp(x, n); addOrb(x + n * 20, GY - 95, "yellow"); return n * 40 + 140; },
    pinkOrb: function (x) { addSp(x, 4); addOrb(x + 80, GY - 90, "pink"); return 4 * 40 + 150; },
    orbWide: function (x) { var n = ri(7, 8); addSp(x, n); addOrb(x + n * 20, GY - 95, "yellow"); return n * 40 + 150; },
    redOrb: function (x) { addSp(x, 7); addOrb(x + 140, GY - 100, "red"); return 7 * 40 + 160; },
    bridge: function (x) { addBlk(x, 80, 40); addSp(x + 80, 2); addBlk(x + 160, 80, 40); return 260; },
    blockPad: function (x) { addBlk(x, 160, 40); addPad(x + 120, GY - 40, "yellow"); addSp(x + 200, 4); return 470; }
  };
  function pool(d) {
    var p = ["spikes", "spikes", "hop"];
    if (d >= 2) p.push("pad");
    if (d >= 4) p.push("orb");
    if (d >= 5) p.push("pinkOrb");
    if (d >= 6) p.push("stairs", "bridge", "redPad");
    if (d >= 9) p.push("blockPad", "orb", "redOrb");
    if (d >= 12) p.push("orbWide", "stairs");
    return p;
  }

  /* ---------- zones: ship, ufo, wave, spider, gravity ---------- */
  var LEVEL_MODES = [[], ["ship"], ["flip", "ufo"], ["wave", "ship", "ufo"], ["spider", "wave", "flip", "ship"], ["ship", "ufo", "wave", "spider", "flip"]];
  var pendKind = null, bannerLvl = 0, bannerSub = "", BANT = 2.8;
  function lvlI() { return Math.min(5, Math.floor(correctN / 3)); }
  function unlocked() { return LEVEL_MODES[lvlI()]; }
  function pillars(z, gapBase, gapMin, spacing, d) {
    var x = z.x0 + 480, prevC = 275, w = 70;
    while (x < z.x1 - 420) {
      var gap = Math.max(gapMin, gapBase - 5 * d + ri(-6, 10)), cmin = CL + gap / 2 + 18, cmax = GY - gap / 2 - 18;
      var c = cl(prevC + ri(-110, 110), cmin, cmax), fh = GY - (c + gap / 2), ch = (c - gap / 2) - CL;
      if (fh > 14) addBlk(x, w, fh, true);
      if (ch > 14) { addCb(x, w, ch); if (fh > 14) obs[obs.length - 1].nc = true; }
      if (d >= 6 && Math.random() < 0.35 && x + w + spacing < z.x1 - 420) {
        var c2 = cl(c + ri(-60, 60), cmin, cmax);
        addSaw(x + w + spacing / 2, (c + c2) / 2 + (Math.random() < 0.5 ? -62 : 62), 18);
      }
      prevC = c; x += w + spacing;
    }
  }
  function waveProfile(z, d) {
    var g = Math.max(78, 112 - 3 * d), lim = 155 - g - 8, pts = [], cx = z.x0 + 450, c = 275;
    z.g = g; z.prof = pts; pts.push({ x: z.x0, c: 275 }); pts.push({ x: cx, c: 275 });
    while (cx < z.x1 - 750) {
      var dy = (Math.random() < 0.5 ? -1 : 1) * [50, 80, 110, 140][ri(0, 3)], tg = cl(c + dy, 275 - lim, 275 + lim), real = tg - c;
      if (Math.abs(real) < 30) { cx += ri(120, 200); }
      else { cx += Math.abs(real); c = tg; }
      pts.push({ x: cx, c: c });
      if (Math.random() < 0.6) { cx += ri(90, 170); pts.push({ x: cx, c: c }); }
    }
    cx += Math.abs(c - 275); c = 275; pts.push({ x: cx, c: 275 }); pts.push({ x: z.x1 + 40, c: 275 });
    for (var mx = z.x0 + 600; mx < z.x1 - 400; mx += 500) addMk(mx);
    if (d >= 5) {
      var sx = z.x0 + 900;
      while (sx < z.x1 - 800) { addSaw(sx, waveC(z, sx) + ri(-1, 1) * g * 0.42, 16); sx += ri(380, 520); }
    }
  }
  function waveC(z, x) {
    var p = z.prof;
    for (var i = 1; i < p.length; i++) { if (x <= p[i].x) { var a = p[i - 1], b = p[i], t = b.x === a.x ? 1 : (x - a.x) / (b.x - a.x); return a.c + (b.c - a.c) * cl(t, 0, 1); } }
    return 275;
  }
  function waveG(z, x) {
    var a = cl((x - (z.x0 + 450)) / 250, 0, 1), b = cl(((z.x1 - 200) - x) / 250, 0, 1), t = Math.min(a, b);
    t = t * t * (3 - 2 * t);
    return 155 + (z.g - 155) * t;
  }
  function walls(z, x) {
    if (z && z.prof) { var c = waveC(z, x), g = waveG(z, x); return { top: c - g, bot: c + g }; }
    return { top: z ? CL : NOCE, bot: GY };
  }
  function flipLegs(z, d) {
    var x = z.x0 + 520, surf = 0;
    while (x < z.x1 - 650) {
      var n = ri(1, 3), top = surf === 1;
      addSp(x + 80, n, top);
      var px = x + 80 + n * 40 + ri(230, 290), kind = Math.random();
      if (kind < 0.45) addPad(px, top ? CL : GY, "blue", top);
      else if (kind < 0.8 || d < 6) addOrb(px, top ? CL + 95 : GY - 95, "blue");
      else addOrb(px, top ? CL + 95 : GY - 95, "green");
      x = px + 380; surf = 1 - surf;
    }
  }
  function spiderObs(z, d) {
    var x = z.x0 + 520, gap = Math.max(250, 340 - 8 * d);
    while (x < z.x1 - 420) {
      var n = ri(1, 2), top = Math.random() < 0.5;
      addSp(x, n, top);
      if (d >= 11 && Math.random() < 0.3) { addSp(x + n * 40 + 150, 1, !top); x += 190; }
      x += n * 40 + gap + ri(0, 80);
    }
  }
  function makeZone(k, x, d) {
    var len = k === "spider" ? ri(1700, 2000) : ri(1900, 2400), z = { k: k, x0: x, x1: x + len };
    zones.push(z);
    if (k === "ship") pillars(z, 190, 150, 360, d);
    else if (k === "ufo") pillars(z, 215, 175, 400, d);
    else if (k === "wave") waveProfile(z, d);
    else if (k === "flip") flipLegs(z, d);
    else spiderObs(z, d);
    return len;
  }
  function zoneAt(x) {
    for (var i = 0; i < zones.length; i++) if (x >= zones[i].x0 && x < zones[i].x1) return zones[i];
    return null;
  }
  function spawn() {
    while (nextX < dist + CXS + W + 200) {
      var d = diff(), all = unlocked(), K = all.length > 1 ? all.filter(function (k) { return k !== lastKind; }) : all;
      if (pendKind && nextX - lastZoneEnd > 700) {
        var pk = pendKind; pendKind = null; var pl = makeZone(pk, nextX, d); lastKind = pk; lastZoneEnd = nextX + pl; nextX += pl + 650 + Math.random() * 200;

    if (streak >= 2) { ctx.fillStyle = "#F2B632"; ctx.fillText("Streak " + streak, W - 20, 58); }
    if (bannerT > 0) {
      ctx.globalAlpha = Math.max(0, Math.min(1, bannerT * 1.2, (BANT - bannerT) * 3));
      drawFace(bannerLvl, W / 2 - 230, 205, 88);
      ctx.textAlign = "left"; ctx.fillStyle = FCOL[bannerLvl]; glowOn(FCOL[bannerLvl], 18);
      ctx.font = "600 52px Fredoka, 'Trebuchet MS', sans-serif"; ctx.fillText(bannerTxt, W / 2 - 170, 200);
      glowOff(); ctx.font = "500 24px Fredoka, 'Trebuchet MS', sans-serif"; ctx.fillStyle = "#EAF0FF"; ctx.fillText(bannerSub, W / 2 - 170, 240); ctx.globalAlpha = 1;
    }
    if (modeT > 0 && pm !== "cube") {
      ctx.globalAlpha = Math.max(0, Math.min(1, modeT * 1.5, (2.6 - modeT) * 4)); ctx.textAlign = "center"; ctx.fillStyle = modeCol;
      ctx.font = "600 30px Fredoka, 'Trebuchet MS', sans-serif"; ctx.fillText(modeTxt, W / 2, 300); ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + Math.min(0.5, flash * 1.6) + ")"; ctx.fillRect(0, 0, W, H); }
    if ((mode === "play") && attempt === 1 && correctN === 0 && taps === 0 && dist < 2000) {
      ctx.save(); ctx.shadowColor = "rgba(0,0,10,.9)"; ctx.shadowBlur = 6;
      ctx.textAlign = "center"; ctx.fillStyle = "rgba(234,240,255,.95)"; ctx.font = "500 24px Fredoka, 'Trebuchet MS', sans-serif";
      ctx.fillText("Tap to jump \u00b7 tap again in the air to jump higher", W / 2, 130); ctx.restore();
    }
  }
  function loop(ts2) {
    var dtR = Math.min(0.033, (ts2 - lastT) / 1000 || 0); lastT = ts2;
    update(dtR); draw(); requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */
  pn.addEventListener("click", function (e) {
    var r = e.target.closest ? e.target.closest("[data-r]") : null;
    if (r && !r.disabled) { reviewAnswer(parseInt(r.getAttribute("data-r"), 10)); return; }
    var b = e.target.closest ? e.target.closest("[data-a]") : null; if (!b) return;
    var a = b.getAttribute("data-a");
    if (a === "start") newGame();
    else if (a === "login") doLogin();
    else if (a === "logout") logout();
    else if (a === "rvnext" || a === "rvretry") { pn.innerHTML = '<p class="ss">Loading...</p>'; loadReviewQ(); }
    else if (a === "rvback") backToGame();
  });
  pn.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target && e.target.tagName === "INPUT") { e.preventDefault(); doLogin(); } });
  sheet.addEventListener("click", function (e) {
    var rt = e.target.closest ? e.target.closest("[data-a=retryq]") : null;
    if (rt) { openQuestion(); return; }
    var b = e.target.closest ? e.target.closest(".opt") : null; if (b && !b.disabled && b.hasAttribute("data-i")) answer(parseInt(b.getAttribute("data-i"), 10));
  });
  sheet.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  box.addEventListener("pointerdown", function () { press(); });
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  window.addEventListener("blur", release);
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { if (mode === "play") { e.preventDefault(); if (!e.repeat) press(); } }
    else if (mode === "ask" && /^Digit[1-4]$/.test(e.code)) { answer(parseInt(e.code.slice(5), 10) - 1); }
    else if (mode === "review" && /^Digit[1-4]$/.test(e.code)) { reviewAnswer(parseInt(e.code.slice(5), 10) - 1); }
  });
  window.addEventListener("keyup", function (e) { if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") release(); });

  boot();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
